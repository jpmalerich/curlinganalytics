<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curling Shotmaking Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1e2329; font-size: 14px; }
  h1 { font-size: 1.6rem; font-weight: 700; }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 18px 0 8px; }
  h3 { font-size: .98rem; font-weight: 600; margin: 16px 0 6px; }
  h3 .sub { font-weight: 400; color: #666; margin-left: 8px; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 290px; min-width: 260px; background: #fff; border-right: 1px solid #e0e4ea; padding: 16px; overflow-y: auto; flex-shrink: 0; }
  .main { flex: 1; padding: 20px 24px; overflow-x: auto; min-width: 0; }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .caption { color: #666; font-size: 12px; margin: 4px 0 14px; line-height: 1.6; }
  .note { color: #777; font-size: 12px; margin: -6px 0 12px; }
  .data-badge { background: #e8f9ee; border: 1px solid #b2dfcb; border-radius: 6px; padding: 10px 12px; font-size: 12px; color: #1a5f3a; margin-bottom: 12px; }
  .data-badge strong { display: block; font-size: 13px; margin-bottom: 2px; }
  .sidebar h2 { font-size: 1rem; color: #333; border-bottom: 1px solid #e0e4ea; padding-bottom: 6px; margin-top: 4px; }
  .filter-section { margin: 12px 0; }
  .filter-section > label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .check-list { max-height: 320px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; padding: 4px; background: #fafbfc; }
  .check-list label { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; padding: 2px 4px; border-radius: 3px; cursor: pointer; }
  .check-list label:hover { background: #f0f4ff; }
  .check-list .team { color: #888; font-size: 11px; }
  .check-list input { margin-top: 3px; accent-color: #1f77b4; }
  .btn-small { font-size: 11px; padding: 2px 8px; border: 1px solid #ccc; border-radius: 3px; background: #fff; cursor: pointer; margin-right: 4px; }
  .btn-small:hover { background: #e8f3ff; border-color: #1f77b4; }
  .tabs { display: flex; gap: 2px; border-bottom: 2px solid #e0e4ea; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn { padding: 8px 14px; border: none; background: none; cursor: pointer; font-size: 13px; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
  .tab-btn:hover { color: #1f77b4; }
  .tab-btn.active { color: #1f77b4; border-bottom-color: #1f77b4; font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .control-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .control-row select { font-size: 14px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; background: #fff; min-width: 240px; }
  .control-row label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .control-row .lbl { font-weight: 600; color: #555; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .metric-row { display: flex; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .metric-card { flex: 1; min-width: 130px; max-width: 260px; background: #fff; border: 1px solid #e0e4ea; border-radius: 8px; padding: 12px 14px; }
  .metric-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .metric-value { font-size: 1.6rem; font-weight: 700; }
  .metric-delta { font-size: 12px; margin-top: 2px; }
  .metric-delta.up { color: #1a7f3c; } .metric-delta.down { color: #c0392b; }
  .metric-count { font-size: 11px; color: #999; margin-top: 2px; }
  .table-wrap { overflow-x: auto; margin-bottom: 14px; }
  .table-wrap.tall { max-height: 640px; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  th { background: #f5f6f8; color: #555; font-size: 12px; font-weight: 600; text-align: left; padding: 7px 10px; border-bottom: 1px solid #e0e4ea; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 6px 10px; border-bottom: 1px solid #f0f2f5; font-size: 13px; white-space: nowrap; }
  tr:hover td { background: #fafbff; }
  tr.total td { background: #eef1f6; font-weight: 600; }
  tr.opp-first td { border-top: 2px solid #e0e4ea; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.grp-opp { color: #b0362f; } th.grp-sel { color: #4b6a8a; }
  .chart-wrap { background: #fff; border: 1px solid #e0e4ea; border-radius: 8px; padding: 14px; margin-bottom: 14px; position: relative; }
  .chart-wrap.h420 { height: 440px; } .chart-wrap.h360 { height: 360px; }
  hr { border: none; border-top: 1px solid #e0e4ea; margin: 20px 0; }
  .empty { color: #777; background: #fff; border: 1px dashed #ccd; border-radius: 6px; padding: 14px; }
  details { margin: 6px 0 12px; } summary { cursor: pointer; color: #1f77b4; font-size: 13px; margin-bottom: 6px; }
  @media (max-width: 760px) { .layout { flex-direction: column; } .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e0e4ea; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="data-badge">
      <strong>📂 Pre-loaded data</strong>
      <span id="data-counts"></span><br>
      <span style="color:#888;font-size:11px">Generated 2026-11-26 10:02</span>
    </div>
    <h2>Filters</h2>
    <div class="filter-section">
      <label>Curling year</label>
      <div style="margin-bottom:4px"><button class="btn-small" onclick="setSeasons(true)">All</button><button class="btn-small" onclick="setSeasons(false)">None</button></div>
      <div class="check-list" id="season-filter"></div>
    </div>
    <div class="filter-section">
      <label>Events</label>
      <div style="margin-bottom:4px"><button class="btn-small" onclick="setEvents(true)">All</button><button class="btn-small" onclick="setEvents(false)">None</button></div>
      <div class="check-list" id="event-filter"></div>
    </div>
  </aside>

  <main class="main">
    <div class="header"><span style="font-size:2rem">🥌</span><h1>Curling Shotmaking Dashboard</h1></div>
    <p class="caption" id="summary-caption"></p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="overview">📊 Overview</button>
      <button class="tab-btn" data-tab="bygame">🎮 By Event</button>
      <button class="tab-btn" data-tab="byplayer">👤 By Player</button>
      <button class="tab-btn" data-tab="shottype">🎯 Shot Type</button>
      <button class="tab-btn" data-tab="rotation">🔄 Rotation</button>
      <button class="tab-btn" data-tab="raw">📋 Raw Data</button>
    </div>

    <section class="tab-panel active" id="tab-overview">
      <div class="control-row"><span class="lbl">Team</span><select id="ov-team" class="team-select"></select></div>
      <div id="ov-body"></div>
    </section>

    <section class="tab-panel" id="tab-bygame">
      <div class="control-row"><span class="lbl">Event</span><select id="game-event"></select></div>
      <div id="game-body"></div>
    </section>

    <section class="tab-panel" id="tab-byplayer">
      <div class="control-row"><span class="lbl">Player</span><select id="player-sel"></select></div>
      <div id="player-body"></div>
    </section>

    <section class="tab-panel" id="tab-shottype">
      <div class="control-row"><span class="lbl">Team</span><select id="type-team" class="team-select"></select></div>
      <div id="type-body"></div>
    </section>

    <section class="tab-panel" id="tab-rotation">
      <div class="control-row"><span class="lbl">Team</span><select id="rot-team" class="team-select"></select></div>
      <div id="rot-body"></div>
    </section>

    <section class="tab-panel" id="tab-raw">
      <div class="control-row">
        <span class="lbl">Team</span><select id="raw-team"></select>
        <label><input type="checkbox" id="raw-opp"> Include opposition shots</label>
        <button class="btn-small" id="raw-download">⬇ Download as CSV</button>
      </div>
      <div id="raw-body"></div>
    </section>
  </main>
</div>

  const s = rows.filter(isScored), out = {};
  CATS.forEach(c => { const x = s.filter(r => r.cat === c).map(r => r.pct); out[c] = [mean(x), x.length]; });
  out.Overall = [mean(s.map(r => r.pct)), s.length];
  return out;
}
function selection(rows) {
  const s = rows.filter(isScored), n = s.length, out = {};
  CATS.forEach(c => out[c] = n ? s.filter(r => r.cat === c).length / n : NaN);
  return out;
}
function statCells(cs) {
  const cells = [];
  CATS.forEach(c => { cells.push(pctCell(cs[c][0]), numCell(cs[c][1])); });
  cells.push(pctCell(cs.Overall[0], true), numCell(cs.Overall[1]));
  return cells;
}
const STAT_HEADS = [...CATS.flatMap(c => [[c + ' %', 'num'], [c + ' n', 'num']]), ['Overall %', 'num'], ['Shots', 'num']];
const pctCell = (v, bold) => ({ v: fmtPct(v), cls: 'num', bold });
const numCell = v => ({ v: v, cls: 'num' });

function table(heads, rows, opts = {}) {
  // heads: [label, cls] ; rows: {cells:[{v,cls}|string], cls}
  let h = '<div class="table-wrap' + (opts.tall ? ' tall' : '') + '"><table><thead><tr>';
  heads.forEach(([l, c]) => h += '<th class="' + (c || '') + '">' + esc(l) + '</th>');
  h += '</tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr class="' + (r.cls || '') + '">';
    r.cells.forEach(c => {
      const o = (c && typeof c === 'object') ? c : { v: c };
      const v = (o.v == null || o.v === '') ? (o.blank ? '' : '') : o.v;
      h += '<td class="' + (o.cls || '') + '">' + (o.bold ? '<b>' + esc(v) + '</b>' : esc(v)) + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}
function metricCards(cs, compare, keys = ['Overall', ...CATS]) {
  return '<div class="metric-row">' + keys.map(k => {
    const [v, n] = cs[k];
    let delta = '';
    if (compare && !isNaN(v) && !isNaN(compare[k][0])) {
      const d = (v - compare[k][0]) * 100;
      delta = '<div class="metric-delta ' + (d >= 0 ? 'up' : 'down') + '">' + (d >= 0 ? '▲ +' : '▼ ') + d.toFixed(1) + ' pts vs opp</div>';
    }
    const note = n.toLocaleString() + ' shots' + (compare ? ' · Opp ' + fmtPct(compare[k][0]) : '');
    return '<div class="metric-card"><div class="metric-label">' + k + '</div><div class="metric-value">' + fmtPct(v) + '</div>' + delta + '<div class="metric-count">' + note + '</div></div>';
  }).join('') + '</div>';
}
function chart(id, config) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  const el = document.getElementById(id);
  if (!el || typeof Chart === 'undefined') return;
  charts[id] = new Chart(el, config);
}
const pctTicks = { callback: v => v + '%' };
const to100 = v => (v == null || isNaN(v)) ? null : +(v * 100).toFixed(1);
const fmtDate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';

// ── Filters ──────────────────────────────────────────────────────────────────
function buildFilters() {
  const seasons = [...new Set(EVENTS.map(e => e.season))].sort().reverse();
  const defSeasons = new Set(seasons.slice(0, 2));
  document.getElementById('season-filter').innerHTML = seasons.map(s =>
    '<label><input type="checkbox" class="season-cb" value="' + esc(s) + '"' + (defSeasons.has(s) ? ' checked' : '') + '> ' + esc(s) + '</label>').join('');
  document.getElementById('event-filter').innerHTML = EVENTS.map((e, i) =>
    '<label data-season="' + esc(e.season) + '"><input type="checkbox" class="event-cb" value="' + i + '"' + (defSeasons.has(e.season) ? ' checked' : '') +
    '> <span>' + esc(e.event) + '<br><span class="team">' + esc(e.team) + ' · ' + esc(e.date) + '</span></span></label>').join('');
  document.querySelectorAll('.season-cb').forEach(cb => cb.addEventListener('change', () => { syncEvents(cb.value, cb.checked); render(); }));
  document.getElementById('event-filter').addEventListener('change', render);
  syncEvents();
}
function syncEvents(changedSeason, nowOn) {
  const sel = new Set([...document.querySelectorAll('.season-cb:checked')].map(c => c.value));
  document.querySelectorAll('#event-filter label').forEach(lab => {
    const cb = lab.querySelector('input'), s = lab.dataset.season, ok = sel.has(s);
    if (changedSeason === s) cb.checked = nowOn;
    if (!ok) cb.checked = false;
    cb.disabled = !ok; lab.style.display = ok ? '' : 'none';
  });
}
function setSeasons(v) { document.querySelectorAll('.season-cb').forEach(cb => cb.checked = v); document.querySelectorAll('.event-cb').forEach(cb => cb.checked = v); syncEvents(); render(); }
function setEvents(v) { document.querySelectorAll('.event-cb:not(:disabled)').forEach(cb => cb.checked = v); render(); }
const selectedEventIdx = () => [...document.querySelectorAll('.event-cb:checked')].map(c => +c.value).sort((a, b) => a - b);

function fillSelect(el, options, keep) {     // options: [value, label]
  const prev = keep ? el.value : null;
  el.innerHTML = options.map(([v, l]) => '<option value="' + esc(v) + '">' + esc(l) + '</option>').join('');
  if (prev != null && options.some(([v]) => String(v) === prev)) el.value = prev;
}

// ── Render ───────────────────────────────────────────────────────────────────
let STATE = {};
function render() {
  const evIdx = selectedEventIdx();
  const evSet = new Set(evIdx);
  const rows = ROWS.filter(r => evSet.has(r.ei));
  const seasons = new Set(evIdx.map(i => EVENTS[i].season));
  STATE = { evIdx, evSet, rows };
  document.getElementById('summary-caption').textContent =
    evIdx.length + ' event(s) selected across ' + seasons.size + ' curling year(s) · ' +
    rows.filter(r => !r.opp).length.toLocaleString() + ' team shots · ' +
    rows.filter(r => r.opp).length.toLocaleString() + ' opposition shots';

  fillSelect(document.getElementById('game-event'), [...evIdx].reverse().map(i => [i, EVENTS[i].label]), true);
  const teamRows = rows.filter(r => !r.opp);
  const counts = new Map(); teamRows.forEach(r => counts.set(r.thrower, (counts.get(r.thrower) || 0) + 1));
  const players = [...counts.keys()].sort(cmpStr);
  const ps = document.getElementById('player-sel'), hadPlayer = ps.value;
  fillSelect(ps, players.map(p => [p, p]), true);
  if (!hadPlayer || !players.includes(hadPlayer)) {
    let best = null, bn = -1; players.forEach(p => { if (counts.get(p) > bn) { bn = counts.get(p); best = p; } });
    if (best) ps.value = best;
  }
  renderOverview(); renderGame(); renderPlayer(); renderShotType(); renderRotation(); renderRaw();
}
const noEvents = () => STATE.evIdx.length ? '' : '<div class="empty">No events selected. Pick at least one curling year and event in the sidebar.</div>';
const teamEvents = team => STATE.evIdx.filter(i => EVENTS[i].team === team);

// ── Overview ─────────────────────────────────────────────────────────────────
function renderOverview() {
  const body = document.getElementById('ov-body');
  if (!STATE.evIdx.length) { body.innerHTML = noEvents(); return; }
  const team = document.getElementById('ov-team').value;
  const evs = teamEvents(team);
  if (!evs.length) { body.innerHTML = '<div class="empty">None of the selected events are ' + esc(team) + ' events.</div>'; return; }
  const d = STATE.rows.filter(r => r.team === team), t = d.filter(r => !r.opp), o = d.filter(r => r.opp);
  const prev = { opp: true, cats: false, sel: false, ...(STATE.ovOpts || {}) };
  let h = '<h2>' + esc(team) + ' — overall shooting %</h2>' + metricCards(catStats(t), catStats(o));
  h += '<hr><h2>Shooting % by event (chronological)</h2><div class="control-row">' +
    '<label><input type="checkbox" id="ov-opp"' + (prev.opp ? ' checked' : '') + '> Opposition shooting %</label>' +
    '<label><input type="checkbox" id="ov-cats"' + (prev.cats ? ' checked' : '') + '> Hit / draw / guard shooting %</label>' +
    '<label><input type="checkbox" id="ov-sel"' + (prev.sel ? ' checked' : '') + '> Shot selection % (hit / draw / guard)</label></div>' +
    '<div class="chart-wrap h420"><canvas id="ov-chart"></canvas></div>';

  const per = evs.map(i => {
    const de = d.filter(r => r.ei === i), te = de.filter(r => !r.opp), oe = de.filter(r => r.opp);
    return { i, ev: EVENTS[i], t: catStats(te), o: catStats(oe), s: selection(te) };
  });
  h += '<h2>By event (most recent first)</h2>';
  const heads = [['Event'], ['Date'], ['Games', 'num'], ...STAT_HEADS,
    ...CATS.map(c => ['Opp ' + c + ' %', 'num grp-opp']), ['Opp %', 'num grp-opp'], ['Opp shots', 'num grp-opp'],
    ...CATS.map(c => [c + ' sel', 'num grp-sel'])];
  const rowOf = (name, date, games, ts, os, ss, cls) => ({ cls, cells: [name, date, numCell(games), ...statCells(ts),
    ...CATS.map(c => pctCell(os[c][0])), pctCell(os.Overall[0]), numCell(os.Overall[1]), ...CATS.map(c => pctCell(ss[c]))] });
  const trs = [...per].reverse().map(p => rowOf(p.ev.event, p.ev.date, p.ev.games, p.t, p.o, p.s));
  const games = new Set(d.map(r => r.ei + '|' + r.game)).size;
  trs.push(rowOf('All selected events', '', games, catStats(t), catStats(o), selection(t), 'total'));
  h += table(heads, trs);
  h += '<p class="note">Team columns first, then opposition shooting % (Opp …), then team shot selection (… sel = share of team shots that were hits / draws / guards).</p>';
  body.innerHTML = h;

  const draw = () => {
    const opts = { opp: document.getElementById('ov-opp').checked, cats: document.getElementById('ov-cats').checked, sel: document.getElementById('ov-sel').checked };
    STATE.ovOpts = opts;
    const ds = [];
    ds.push({ type: 'line', label: team + ' %', data: per.map(p => to100(p.t.Overall[0])), borderColor: DATA.teamColor, backgroundColor: DATA.teamColor, borderWidth: 3, pointRadius: 5, tension: .15, order: 0, n: per.map(p => p.t.Overall[1]) });
    if (opts.cats) CATS.forEach(c => ds.push({ type: 'line', label: c + ' %', data: per.map(p => to100(p.t[c][0])), borderColor: CAT_COLORS[c], backgroundColor: CAT_COLORS[c], borderWidth: 1.8, pointRadius: 3.5, tension: .15, order: 1, n: per.map(p => p.t[c][1]) }));
    if (opts.opp) ds.push({ type: 'line', label: 'Opposition %', data: per.map(p => to100(p.o.Overall[0])), borderColor: DATA.oppColor, backgroundColor: DATA.oppColor, borderDash: [6, 4], borderWidth: 2, pointRadius: 3.5, tension: .15, order: 1, n: per.map(p => p.o.Overall[1]) });
    if (opts.sel) CATS.forEach(c => ds.push({ type: 'bar', label: c + ' selection', data: per.map(p => to100(p.s[c])), backgroundColor: CAT_COLORS[c] + '59', borderColor: CAT_COLORS[c], borderWidth: 1, order: 5, n: per.map(p => p.t[c][1]) }));
    chart('ov-chart', { data: { labels: per.map(p => p.ev.event), datasets: ds },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        scales: { y: { min: 0, max: 100, ticks: pctTicks, title: { display: true, text: '%' } }, x: { ticks: { maxRotation: 35, minRotation: 0 } } },
        plugins: { legend: { position: 'top', align: 'start' },
          tooltip: { callbacks: { title: items => { const p = per[items[0].dataIndex]; return p.ev.event + ' (' + fmtDate(p.ev.date) + ')'; },
            label: ctx => ctx.dataset.label + ': ' + (ctx.parsed.y == null ? '—' : ctx.parsed.y.toFixed(1) + '%') + ' (' + ctx.dataset.n[ctx.dataIndex] + ' shots)' } } } } });
  };
  ['ov-opp', 'ov-cats', 'ov-sel'].forEach(id => document.getElementById(id).addEventListener('change', draw));
  draw();
}

// ── By Event ─────────────────────────────────────────────────────────────────
function lineupRows(d) {
  const out = [];
  [[false, 'Team total'], [true, 'Opposition total']].forEach(([isOpp, totalLabel], k) => {
    const sd = d.filter(r => r.opp === isOpp);
    if (!sd.length) return;
    const g = byKey(sd, r => r.thrower);
    const order = [...g.entries()].map(([name, rs]) => ({ name, rs, slot: mean(rs.map(r => r.slot)), pos: mean(rs.map(r => r.pos)), n: rs.length }))
      .sort((a, b) => a.slot - b.slot || a.pos - b.pos || b.n - a.n || cmpStr(a.name, b.name));
    order.forEach((p, j) => out.push({ cls: (k === 1 && j === 0) ? 'opp-first' : '',
      cells: [isOpp ? 'Opposition' : 'Team', posLabel(mode(p.rs.map(r => r.pos))), isOpp ? '' : p.name, ...lineupCells(catStats(p.rs))] }));
    out.push({ cls: 'total', cells: [isOpp ? 'Opposition' : 'Team', '', totalLabel, ...lineupCells(catStats(sd))] });
  });
  return out;
}
// Overall shooting % and total shots sit right after the player name.
const LINEUP_HEADS = [['Side'], ['Position'], ['Player'], ['Overall %', 'num'], ['Shots', 'num'], ...CATS.flatMap(c => [[c + ' %', 'num'], [c + ' n', 'num']])];
const lineupCells = cs => [pctCell(cs.Overall[0], true), numCell(cs.Overall[1]), ...CATS.flatMap(c => [pctCell(cs[c][0]), numCell(cs[c][1])])];
function renderGame() {
  const body = document.getElementById('game-body');
  if (!STATE.evIdx.length) { body.innerHTML = noEvents(); return; }
  const i = +document.getElementById('game-event').value, ev = EVENTS[i];
  const de = ROWS.filter(r => r.ei === i);
  let h = '<p class="caption">' + esc(ev.team) + ' · ' + fmtDate(ev.date) + ' · ' + ev.games + ' game(s)</p>';
  const head = (title, d) => '<h3>' + title + '<span class="sub">Team ' + fmtPct(catStats(d.filter(r => !r.opp)).Overall[0]) + ' · Opposition ' + fmtPct(catStats(d.filter(r => r.opp)).Overall[0]) + '</span></h3>';
  h += head('Event totals', de) + table(LINEUP_HEADS, lineupRows(de)) + '<p class="note">Team positions are worked out from throwing order in each end.</p><hr>';
  [...new Set(de.map(r => r.game))].sort((a, b) => a - b).forEach(g => {
    const dg = de.filter(r => r.game === g);
    h += head('Game ' + g, dg) + table(LINEUP_HEADS, lineupRows(dg));
  });
  body.innerHTML = h;
}

// ── By Player ────────────────────────────────────────────────────────────────
function shotTypeRows(t, o) {
  const m = new Map();
  const add = (rows, key) => rows.filter(isScored).forEach(r => {
    const k = r.shot_type + '|' + r.cat;
    if (!m.has(k)) m.set(k, { type: r.shot_type, cat: r.cat, t: [], o: [] });
    m.get(k)[key].push(r.pct);
  });
  add(t, 't'); if (o) add(o, 'o');
  return [...m.values()].map(x => ({ ...x, tv: mean(x.t), tn: x.t.length, ov: mean(x.o), on: x.o.length }))
    .sort((a, b) => b.tn - a.tn || cmpStr(a.type, b.type));
}
function renderPlayer() {
  const body = document.getElementById('player-body');
  if (!STATE.evIdx.length) { body.innerHTML = noEvents(); return; }
  const player = document.getElementById('player-sel').value;
  const dp = STATE.rows.filter(r => !r.opp && r.thrower === player);
  if (!dp.length) { body.innerHTML = '<div class="empty">No team shots in the selected events.</div>'; return; }
  const teamEv = new Map(); dp.forEach(r => { if (!teamEv.has(r.team)) teamEv.set(r.team, new Set()); teamEv.get(r.team).add(r.ei); });
  const nGames = new Set(dp.map(r => r.ei + '|' + r.game)).size;
  let h = '<p class="caption">' + [...teamEv.keys()].sort(cmpStr).map(t => esc(t) + ': ' + teamEv.get(t).size + ' event(s)').join(' · ') +
    ' · ' + nGames + ' games · ' + dp.filter(isScored).length.toLocaleString() + ' scored shots</p>';
  h += '<h2>Overall shooting %</h2>' + metricCards(catStats(dp), null, [...CATS, 'Overall']);

  h += '<h2>By rotation</h2>';
  const s = dp.filter(isScored), turns = [...new Set(s.map(r => r.turn).filter(Boolean))].sort(cmpStr);
  const rot = turns.map(tu => { const x = s.filter(r => r.turn === tu); return { tu, cs: catStats(x), share: s.length ? x.length / s.length : NaN }; });
  h += '<div class="metric-row">' + rot.map(r => '<div class="metric-card"><div class="metric-label">' + esc(r.tu) + '</div><div class="metric-value">' + fmtPct(r.cs.Overall[0]) + '</div><div class="metric-count">' + fmtPct(r.share, 0) + ' of shots (' + r.cs.Overall[1].toLocaleString() + ')</div></div>').join('') + '</div>';
  if (rot.length) h += '<details><summary>Rotation by shot category</summary>' + table([['Rotation'], ...STAT_HEADS, ['Share', 'num']], rot.map(r => ({ cells: [r.tu, ...statCells(r.cs), pctCell(r.share)] }))) + '</details>';

  h += '<h2>Game by game</h2>';
  const trs = [];
  [...STATE.evIdx].reverse().forEach(i => {
    const de = dp.filter(r => r.ei === i); if (!de.length) return;
    const ev = EVENTS[i];
    [...new Set(de.map(r => r.game))].sort((a, b) => a - b).forEach(g => {
      const dg = de.filter(r => r.game === g);
      trs.push({ cells: [ev.event, ev.team, 'Game ' + g, posLabel(mode(dg.map(r => r.pos))), ...statCells(catStats(dg))] });
    });
    trs.push({ cls: 'total', cells: [ev.event, ev.team, 'Event total', '', ...statCells(catStats(de))] });
  });
  h += table([['Event'], ['Team'], ['Game'], ['Position'], ...STAT_HEADS], trs, { tall: true });

  h += '<h2>By shot type</h2>';
  const st = shotTypeRows(dp);
  h += table([['Shot type'], ['Category'], ['Shooting %', 'num'], ['Shots', 'num']], st.map(x => ({ cells: [x.type, x.cat, pctCell(x.tv), numCell(x.tn)] })));
  const cd = st.filter(x => x.tn >= 3).sort((a, b) => a.tv - b.tv);
  h += '<div class="chart-wrap" style="height:' + Math.max(240, 34 * cd.length + 60) + 'px"><canvas id="player-type-chart"></canvas></div>' +
       '<p class="note">Chart shows shot types with at least 3 shots; colour = category (orange hit, blue draw, teal guard).</p>';
  body.innerHTML = h;
  chart('player-type-chart', { type: 'bar', data: { labels: cd.map(x => x.type), datasets: [{ label: 'Shooting %', data: cd.map(x => to100(x.tv)), backgroundColor: cd.map(x => CAT_COLORS[x.cat]), n: cd.map(x => x.tn) }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { min: 0, max: 100, ticks: pctTicks } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.parsed.x.toFixed(1) + '% (' + ctx.dataset.n[ctx.dataIndex] + ' shots)' } } } } });
}

// ── Shot Type ────────────────────────────────────────────────────────────────
function renderShotType() {
  const body = document.getElementById('type-body');
  if (!STATE.evIdx.length) { body.innerHTML = noEvents(); return; }
  const team = document.getElementById('type-team').value;
  const d = STATE.rows.filter(r => r.team === team), t = d.filter(r => !r.opp), o = d.filter(r => r.opp);

  const st = shotTypeRows(t, o);
  let h = '<h2>' + esc(team) + ' — shooting % by shot type</h2>' +
    table([['Shot type'], ['Category'], ['Team %', 'num'], ['Team shots', 'num'], ['Opp %', 'num grp-opp'], ['Opp shots', 'num grp-opp']],
      st.map(x => ({ cells: [x.type, x.cat, pctCell(x.tv), numCell(x.tn), pctCell(x.ov), numCell(x.on)] })));
  const cd = st.filter(x => x.tn >= 3 && !isNaN(x.tv)).sort((a, b) => a.tv - b.tv);
  h += '<h2>Shot type shooting % — chart</h2><div class="chart-wrap" style="height:' + Math.max(260, 34 * cd.length + 60) + 'px"><canvas id="type-chart"></canvas></div><p class="note">Chart shows shot types with at least 3 team shots.</p>';

    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { min: 0, max: 100, ticks: pctTicks } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.parsed.x.toFixed(1) + '% (' + ctx.dataset.n[ctx.dataIndex] + ' shots)' } } } } });
}

// ── Rotation ─────────────────────────────────────────────────────────────────
function playersByPosition(rows) {
  const g = byKey(rows, r => r.thrower);
  return [...g.entries()].map(([name, rs]) => ({ name, pos: mean(rs.map(r => r.pos)), n: rs.length }))
    .sort((a, b) => a.pos - b.pos || b.n - a.n || cmpStr(a.name, b.name)).map(x => x.name);
}
function renderRotation() {
  const body = document.getElementById('rot-body');
  if (!STATE.evIdx.length) { body.innerHTML = noEvents(); return; }
  const team = document.getElementById('rot-team').value;
  const t = STATE.rows.filter(r => r.team === team && !r.opp);
  if (!t.length) { body.innerHTML = '<div class="empty">No ' + esc(team) + ' shots in the selected events.</div>'; return; }
  const players = playersByPosition(t), s = t.filter(isScored);
  const turns = [...new Set(s.map(r => r.turn).filter(Boolean))].sort(cmpStr);
  const sp = p => s.filter(r => r.thrower === p);
  const shown = players.filter(p => sp(p).length);
  let h = '<h2>' + esc(team) + ' — shooting % by rotation (in-turn vs out-turn)</h2>' +
    '<div style="display:flex;gap:16px;flex-wrap:wrap"><div style="flex:1;min-width:300px"><h3>Shooting %</h3>' +
    table([['Player'], ...turns.map(x => [x, 'num'])], shown.map(p => ({ cells: [p, ...turns.map(tu => pctCell(mean(sp(p).filter(r => r.turn === tu).map(r => r.pct))))] }))) +
    '</div><div style="flex:1;min-width:300px"><h3>Shot count</h3>' +
    table([['Player'], ...turns.map(x => [x, 'num'])], shown.map(p => ({ cells: [p, ...turns.map(tu => numCell(sp(p).filter(r => r.turn === tu).length))] }))) +
    '</div></div><hr><h2>By player, category & rotation</h2>';
  const combos = CATS.flatMap(c => turns.map(tu => [c, tu])).filter(([c, tu]) => s.some(r => r.cat === c && r.turn === tu));
  h += table([['Player'], ...combos.map(([c, tu]) => [c + ' / ' + tu, 'num'])],
    shown.map(p => ({ cells: [p, ...combos.map(([c, tu]) => pctCell(mean(sp(p).filter(r => r.cat === c && r.turn === tu).map(r => r.pct))))] })));
  h += '<div class="chart-wrap h360"><canvas id="rot-chart"></canvas></div>';
  body.innerHTML = h;
  chart('rot-chart', { type: 'bar', data: { labels: shown, datasets: turns.map((tu, i) => ({ label: tu, backgroundColor: ['#1f77b4', '#ff7f0e'][i % 2], data: shown.map(p => to100(mean(sp(p).filter(r => r.turn === tu).map(r => r.pct)))) })) },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100, ticks: pctTicks } },
      plugins: { tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + (ctx.parsed.y == null ? '—' : ctx.parsed.y.toFixed(1) + '%') } } } } });
}

// ── Raw Data ─────────────────────────────────────────────────────────────────
const RAW_COLS = ['season', 'team', 'event', 'date', 'game', 'end', 'thrower', 'position', 'side', 'shot_type', 'shot_cat', 'shot_turn', 'shot_score', 'shot_pct', 'shot_note'];
const rawVals = r => [r.season, r.team, r.event, r.date, r.game, r.end, r.thrower, posLabel(r.pos), r.opp ? 'Opposition' : 'Team', r.shot_type, r.cat, r.turn, r.score == null ? '' : r.score, isNaN(r.pct) ? '' : r.pct, r.note];
function rawRows() {
  const team = document.getElementById('raw-team').value, opp = document.getElementById('raw-opp').checked;
  return STATE.rows.filter(r => (team === 'All teams' || r.team === team) && (opp || !r.opp));
}
function renderRaw() {
  const body = document.getElementById('raw-body');
  if (!STATE.evIdx.length) { body.innerHTML = noEvents(); return; }
  const rows = rawRows(), LIMIT = 1000;
  body.innerHTML = '<p class="caption">' + rows.length.toLocaleString() + ' shots' + (rows.length > LIMIT ? ' — showing the first ' + LIMIT.toLocaleString() + '; the CSV download has all of them' : '') + '</p>' +
    table(RAW_COLS.map(c => [c]), rows.slice(0, LIMIT).map(r => ({ cells: rawVals(r) })), { tall: true });
}
function downloadCsv() {
  const q = v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [RAW_COLS.join(','), ...rawRows().map(r => rawVals(r).map(q).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'shotmaking_data.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── Wiring ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('data-counts').textContent = TEAMS.join(' & ') + ' · ' + ROWS.length.toLocaleString() + ' shots · ' + EVENTS.length + ' events';
  document.querySelectorAll('.team-select').forEach(el => fillSelect(el, TEAMS.map(t => [t, t])));
  fillSelect(document.getElementById('raw-team'), [['All teams', 'All teams'], ...TEAMS.map(t => [t, t])]);
  document.getElementById('ov-team').addEventListener('change', renderOverview);
  document.getElementById('game-event').addEventListener('change', renderGame);
  document.getElementById('player-sel').addEventListener('change', renderPlayer);
  document.getElementById('type-team').addEventListener('change', renderShotType);
  document.getElementById('rot-team').addEventListener('change', renderRotation);
  document.getElementById('raw-team').addEventListener('change', renderRaw);
  document.getElementById('raw-opp').addEventListener('change', renderRaw);
  document.getElementById('raw-download').addEventListener('click', downloadCsv);
  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    document.getElementById('tab-' + b.dataset.tab).classList.add('active'); b.classList.add('active');
    Object.values(charts).forEach(c => c.resize && c.resize());
  }));
  buildFilters();
  render();
});
</script>
</body>
</html>
